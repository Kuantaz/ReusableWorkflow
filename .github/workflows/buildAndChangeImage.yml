name: Build and change image

on:
  workflow_call:
    inputs:
      namespace:
        required: true
        type: string
      app_name:
        required: true
        type: string
      image_repository_name:
        required: true
        type: string
      timeout:
        type: string
        default: "5m"
      runner:
        required: true
        type: string
      environment:
        type: string
        default: "dev"
      dockerfile:
        type: string
        default: "Dockerfile"
      prefix:
        type: string
        default: ""
      directory:
        type: string
        default: "."
      cronjob_name:
        type: string
        default: ""
      cron_container_name:
        type: string
        default: "scheduler"
      cache_from:
        description: "BuildKit cache source (e.g. type=registry,ref=ecr/foo:cache). Leave empty to disable."
        required: false
        type: string
        default: "type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.CACHE_TAG }}"
      cache_to:
        description: "BuildKit cache destination (e.g. type=registry,ref=ecr/foo:cache,mode=max). Leave empty to disable."
        required: false
        type: string
        default: "type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.CACHE_TAG }},mode=max"
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
jobs:
  build:
    runs-on: ${{inputs.runner}}
    environment: ${{inputs.environment}}
    steps:
      - name: Clone
        uses: actions/checkout@v3

      - name: set job env
        run: |
          echo "TAG=${GITHUB_REF_NAME////_}" >> $GITHUB_ENV
          echo "SHORT_SHA=`echo ${GITHUB_SHA} | cut -c 1-8`" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          CACHE_FROM: "type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.CACHE_TAG }}"
          CACHE_TO: "type=registry,ref=${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ env.CACHE_TAG }},mode=max"
          DOCKER_BUILDKIT: "1"
        run: |
          # BuildKit cache flags are only added when the caller passes them,
          # so existing callers keep the exact previous behavior.
          CACHE_FLAGS=""
          if [ -n "$CACHE_FROM" ]; then
            CACHE_FLAGS="$CACHE_FLAGS --cache-from $CACHE_FROM"
          fi
          if [ -n "$CACHE_TO" ]; then
            CACHE_FLAGS="$CACHE_FLAGS --cache-to $CACHE_TO"
          fi

          docker buildx build \
            --builder=default \
            --load \
            --tag ${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:latest-${{inputs.prefix}} \
            --tag ${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:${TAG}-${{inputs.prefix}}-${SHORT_SHA} \
            -f ${{inputs.dockerfile}} \
            $CACHE_FLAGS \
            ${{ inputs.directory }}

          docker push ${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:latest-${{inputs.prefix}}
          docker push ${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:${TAG}-${{inputs.prefix}}-${SHORT_SHA}

      - name: Install and configure kubectl
        run: |
          VERSION=$(curl --silent https://storage.googleapis.com/kubernetes-release/release/stable.txt)
          # https://github.com/aws/aws-cli/issues/6920#issuecomment-1117981158
          VERSION=v1.23.6
          curl https://storage.googleapis.com/kubernetes-release/release/$VERSION/bin/linux/arm64/kubectl \
            --progress-bar \
            --location \
            --remote-name
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          echo ${{ secrets.KUBECONFIG }} | base64 --decode > kubeconfig.yaml

      - name: Deploy
        id: deploy
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image deploy/${{inputs.app_name}}  ${{inputs.app_name}}=${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:${TAG}-${{inputs.prefix}}-${SHORT_SHA} --namespace=${{inputs.namespace}}
      - name: Update CronJob image
        if: inputs.cronjob_name != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          kubectl set image cronjob/${{ inputs.cronjob_name }} \
            ${{ inputs.cron_container_name }}=${{ env.ECR_REGISTRY }}/${{inputs.image_repository_name}}:${TAG}-${{inputs.prefix}}-${SHORT_SHA} \
            --namespace=${{inputs.namespace}}
          kubectl get cronjob ${{ inputs.cronjob_name }} --namespace=${{inputs.namespace}}
      - name: kubernetes deployment status
        run: |
          kubectl rollout status deployment ${{inputs.app_name}} --timeout=${{inputs.timeout}} --namespace=${{inputs.namespace}}

      - name: rollback
        if: steps.deploy.outcome != 'success'
        run: |
          kubectl rollout undo deploy/${{inputs.app_name}} --namespace=${{inputs.namespace}}
      - name: kubernetes deployment check
        run: |
          kubectl get deploy ${{inputs.app_name}} --namespace=${{inputs.namespace}}
